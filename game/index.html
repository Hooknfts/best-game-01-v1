<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prism Drift — a neon colour-matching arcade game</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #05030f;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    width: min(100vw, calc(100vh * 16 / 9));
    height: min(100vh, calc(100vw * 9 / 16));
    background: #05030f;
    cursor: crosshair;
  }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="Prism Drift game canvas"></canvas>
<script type="module" src="./src/boot.js"></script>
</body>
</html>
